name = "photos"
title = "Photos de la campagne"
purpose = "Photos de gares, de points de montée, de véhicules et de panneaux, prises dans l'appli en mode relevé. Aucune ne montre de visage ni de plaque lisible."
protocol = "docs/TERRAIN/MODE-RELEVE.md"
forms = []
key = ["id"]

[[fields]]
name = "id"
label = "Identifiant"
type = "code"
pattern = "PH-[0-9]{5}"
required = true
entry = "app"

[[fields]]
name = "fichier"
label = "Nom du fichier"
type = "code"
pattern = "PH-[0-9]{5}\\.jpg"
required = true
entry = "app"

[[fields]]
name = "date"
label = "Date"
type = "date"
required = true
entry = "app"

[[fields]]
name = "heure"
label = "Heure"
type = "time"
required = true
entry = "app"

[[fields]]
name = "eclaireur"
label = "Code de l'Éclaireur"
type = "code"
pattern = "E[0-9]{2}"
required = true
entry = "app"

[[fields]]
name = "objet"
label = "Gare ou relevé concerné"
type = "code"
pattern = "(GA-[0-9]{4}|RL-[0-9]{4})"
required = true
entry = "app"

[[fields]]
name = "sujet"
label = "Sujet"
type = "enum"
vocabulary = "sujets_photo"
required = true
entry = "app"

[[fields]]
name = "latitude"
label = "Latitude"
type = "decimal"
min = 4.3
max = 10.8
required = true
entry = "app"

[[fields]]
name = "longitude"
label = "Longitude"
type = "decimal"
min = -8.7
max = -2.4
required = true
entry = "app"

[[fields]]
name = "controle"
label = "Vérifiée : ni visage ni plaque lisible"
type = "enum"
vocabulary = "oui_non"
required = true
entry = "app"
help = "Coché par l'Éclaireur dans l'appli, puis revu au bureau."

[[fields]]
name = "floutage"
label = "Zones floutées"
type = "enum"
vocabulary = "oui_non"
required = true
entry = "app"

[[rules]]
type = "equals"
field = "controle"
value = "oui"
message = "une photo non vérifiée ne quitte pas le téléphone : la supprimer ou la flouter puis la vérifier"
