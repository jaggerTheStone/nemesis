name = "observations"
title = "Observations du test de maquettes"
purpose = "Réussite des tâches tirées des parcours clés (partie 4.2) sur le prototype."
protocol = "docs/UX/PROTOCOLE-TESTS-MAQUETTES.md"
forms = ["docs/TERRAIN/fiches/fiche-test-maquettes.html"]
key = ["session", "participant", "tache"]

[[fields]]
name = "session"
label = "Code de session"
type = "code"
pattern = "S[0-9]{8}-[0-9]{2}"
required = true

[[fields]]
name = "participant"
label = "Code participant"
type = "code"
pattern = "P[0-9]{2}"
required = true

[[fields]]
name = "tache"
label = "Tâche"
type = "enum"
vocabulary = "taches"
required = true

[[fields]]
name = "reussite"
label = "Résultat"
type = "enum"
vocabulary = "reussites"
required = true

[[fields]]
name = "duree_secondes"
label = "Durée (secondes)"
type = "integer"
min = 0
max = 3600
required = false

[[fields]]
name = "pressions"
label = "Nombre de pressions"
type = "integer"
min = 0
max = 200
required = false
help = "Surtout pour T4 : la contribution doit tenir en deux pressions (F-07)."

[[fields]]
name = "aide_donnee"
label = "Aide donnée"
type = "text"
max_length = 300
required = false

[[fields]]
name = "notes"
label = "Observations"
type = "text"
max_length = 600
required = false
help = "Hésitations, erreurs, phrases dites par la personne (sans élément d'identité)."

[[fields]]
name = "observateur"
label = "Code de l'observateur"
type = "code"
pattern = "E[0-9]{2}"
required = true

[[references]]
fields = ["session", "participant"]
target = "participants"
target_fields = ["session", "participant"]
