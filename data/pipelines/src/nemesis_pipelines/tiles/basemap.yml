# Fond de carte léger de nemesis (I0.7, ADR-009) : schéma Planetiler « custommap ».
# Rien que l'utile pour se repérer sous les données de l'appli (gares, lignes,
# incidents, servies à part) : eau, verdure, limites, localités, voirie, rail, bacs et
# gares. Ni bâtiments, ni adresses, ni commerces : le pack hors ligne doit tenir
# dans le budget de F-12.
#
# Vérifier les exemples :  planetiler verify basemap.yml
# Générer :                planetiler generate-custom --schema=basemap.yml --osm_path=… --output=….pmtiles
schema_name: nemesis-fond-leger
schema_description: Fond de carte léger de nemesis, tiré d'OpenStreetMap seul.
attribution: <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; les contributeurs d'OpenStreetMap</a>
args:
  osm_path:
    description: Extrait OSM au format PBF
    default: input.osm.pbf
sources:
  osm:
    type: osm
    local_path: "${ args.osm_path }"
definitions:
  attributes:
    - &name
      key: name
layers:
  - id: water
    features:
      - source: osm
        geometry: polygon
        min_zoom:
          default_value: 4
          overrides:
            11:
              waterway: [dock, canal]
        include_when:
          natural: water
          waterway: [riverbank, dock, canal]
          landuse: [reservoir, basin]
        attributes:
          - key: kind
            type: match_value

  - id: waterways
    features:
      - source: osm
        geometry: line
        min_zoom:
          default_value: 9
          overrides:
            13:
              waterway: [stream, drain, ditch]
        include_when:
          waterway: [river, canal, stream, drain, ditch]
        attributes:
          - key: kind
            type: match_value
          - key: name
            min_zoom: 12

  - id: green
    features:
      - source: osm
        geometry: polygon
        min_zoom: 11
        include_when:
          leisure: [park, nature_reserve]
          landuse: [forest, cemetery]
          natural: [wood, wetland]
        attributes:
          - key: kind
            type: match_value

  - id: boundaries
    features:
      - source: osm
        geometry: line
        min_size: 0
        min_zoom:
          default_value: 7
          overrides:
            0:
              admin_level: 2
        include_when:
          __all__:
            - boundary: administrative
            - admin_level: [2, 4]
        attributes:
          - key: admin_level
            type: integer

  - id: places
    features:
      - source: osm
        geometry: point
        include_when:
          place: [city, town, village, suburb, quarter, neighbourhood]
        exclude_when:
          name: ""
        min_zoom:
          default_value: 13
          overrides:
            6:
              place: city
            8:
              place: town
            11:
              place: [village, suburb]
        attributes:
          - key: kind
            type: match_value
          - *name

  - id: roads
    features:
      - source: osm
        geometry: line
        min_size: 0
        min_zoom:
          default_value: 14
          overrides:
            6:
              highway: [motorway, trunk]
            8:
              highway: primary
            9:
              highway: secondary
            10:
              highway: tertiary
            11:
              highway: [motorway_link, trunk_link, primary_link, secondary_link, tertiary_link]
            12:
              highway: [unclassified, residential, living_street]
            13:
              highway: [service, pedestrian]
        include_when:
          highway:
            - motorway
            - motorway_link
            - trunk
            - trunk_link
            - primary
            - primary_link
            - secondary
            - secondary_link
            - tertiary
            - tertiary_link
            - unclassified
            - residential
            - living_street
            - service
            - pedestrian
            - track
            - footway
            - path
            - steps
        attributes:
          - key: kind
            value: '${ match_value.replace("_link", "") }'
          - key: name
            min_zoom: 13
          - key: ref
            min_zoom: 11

  - id: railways
    features:
      - source: osm
        geometry: line
        min_zoom: 8
        include_when:
          railway: [rail, light_rail, subway, tram]
        attributes:
          - key: kind
            type: match_value

  - id: ferries
    features:
      - source: osm
        geometry: line
        min_zoom: 10
        include_when:
          route: ferry
        attributes:
          - *name

  - id: transit
    features:
      - source: osm
        geometry: point
        min_zoom: &transit_zoom
          default_value: 13
          overrides:
            12:
              amenity: [bus_station, ferry_terminal]
        include_when: &transit_filter
          amenity: [bus_station, ferry_terminal]
          railway: [station, halt]
        attributes: &transit_attributes
          - key: kind
            value:
              coalesce:
                - tag_value: amenity
                - tag_value: railway
          - *name
      - source: osm
        geometry: polygon_point_on_surface
        min_zoom: *transit_zoom
        include_when: *transit_filter
        attributes: *transit_attributes

examples:
  - name: une lagune est une surface d'eau
    input:
      source: osm
      geometry: polygon
      tags:
        natural: water
        water: lagoon
    output:
      layer: water
      geometry: polygon
      min_zoom: 4
      tags:
        kind: water

  - name: une route principale apparaît au zoom 8
    input:
      source: osm
      geometry: line
      tags:
        highway: primary
        name: Boulevard des Exemples
        ref: A1
    output:
      layer: roads
      geometry: line
      min_zoom: 8
      tags:
        kind: primary
        name: Boulevard des Exemples
        ref: A1

  - name: une bretelle garde la classe de sa route
    input:
      source: osm
      geometry: line
      tags:
        highway: secondary_link
    output:
      layer: roads
      geometry: line
      min_zoom: 11
      tags:
        kind: secondary

  - name: un chemin piéton n'apparaît qu'au zoom 14
    input:
      source: osm
      geometry: line
      tags:
        highway: footway
    output:
      layer: roads
      geometry: line
      min_zoom: 14
      tags:
        kind: footway

  - name: une gare routière
    input:
      source: osm
      geometry: point
      tags:
        amenity: bus_station
        name: Gare des Exemples
    output:
      layer: transit
      geometry: point
      min_zoom: 12
      tags:
        kind: bus_station
        name: Gare des Exemples

  - name: un quartier
    input:
      source: osm
      geometry: point
      tags:
        place: suburb
        name: Quartier des Exemples
    output:
      layer: places
      geometry: point
      min_zoom: 11
      tags:
        kind: suburb
        name: Quartier des Exemples

  - name: un lieu sans nom n'est pas une étiquette
    input:
      source: osm
      geometry: point
      tags:
        place: neighbourhood
    output: []

  - name: un bâtiment n'est pas dans le fond léger
    input:
      source: osm
      geometry: polygon
      tags:
        building: yes
        name: Immeuble des Exemples
    output: []

  - name: un arrêt de bus n'est pas dans le fond léger (l'appli sert ses propres arrêts)
    input:
      source: osm
      geometry: point
      tags:
        highway: bus_stop
        name: Arrêt des Exemples
    output: []
