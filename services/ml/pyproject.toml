[project]
name = "nemesis-ml"
version = "0.0.0"
description = "Modèles d'attente, de prix et de détection (entraînement et inférence)."
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemesis_ml"]
