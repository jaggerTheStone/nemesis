[package]
name = "routing-ffi"
description = "C interface of the routing engine, for the phone (I0.11, ADR-001)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "nemesis_routing"
crate-type = ["cdylib", "rlib"]

[dependencies]
routing-core = { path = "../routing-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# A C interface needs raw pointers: unsafe code is denied, not forbidden as in the rest
# of the workspace, and allowed only on the exported functions, each with its contract.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
