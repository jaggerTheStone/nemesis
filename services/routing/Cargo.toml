[workspace]
resolver = "3"
members = ["crates/routing-core", "crates/routing-cli", "crates/routing-ffi"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-Proprietary"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Builds de production : le serveur et la bibliothèque du téléphone (ADR-001, poids de
# l'APK). Optimisation globale et symboles retirés.
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
